# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c745ec58d125629b390eb4d4a33fe529"
application_url = "https://example.com"
embedded = true
name = "Consentinel"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_files: the merchant-logo image picker uploads to the store's Files
# (stagedUploadsCreate + fileCreate in app/routes/app.logo-upload.tsx).
# read_themes: the Home checklist reads settings_data.json to show whether
# the consent-banner app embed is actually enabled in the live theme; the
# cookie scanner reads theme source + app embeds.
# write_online_store_pages: the Pro cookie-policy generator creates/updates
# the "Cookie Policy" page (app/models/policyGenerator.server.ts).
# Everything else works on app-owned data only.
scopes = "read_themes,write_files,write_online_store_pages"

[webhooks]
api_version = "2026-10"

  # Mandatory privacy topics (app-review requirement). Handlers:
  # app/routes/webhooks.customers.data_request.tsx / webhooks.customers.redact.tsx /
  # webhooks.shop.redact.tsx.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Instant plan-cache sync when a subscription changes outside the app
  # (approval, cancellation, declined charge, frozen billing). The app-open
  # reconciliation in billing.server.ts remains the safety net.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

# Storefront -> app communication for consent-event logging. The storefront
# posts to /apps/consentinel/consent; Shopify verifies the request signature
# and forwards it to {url}/consent (app/routes/proxy.consent.tsx). The CLI
# rewrites `url` to the dev tunnel while automatically_update_urls_on_dev is on.
[app_proxy]
url = "https://example.com/proxy"
subpath = "consentinel"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
